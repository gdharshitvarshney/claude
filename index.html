<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sky Sort — Airport Boarding Game</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0b1020;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #0b1020;
    display: block;
    box-shadow: 0 0 60px rgba(0,0,0,.6);
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="800"></canvas>
</div>
<script>
(() => {
"use strict";

// ---------------------------------------------------------------------------
// Setup & scaling
// ---------------------------------------------------------------------------
const W = 480, H = 800;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function fit() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
}
window.addEventListener("resize", fit);
fit();

// ---------------------------------------------------------------------------
// Flag definitions (drawn on canvas so they render everywhere)
// ---------------------------------------------------------------------------
const FLAGS = {
  JP: { name: "Japan",       type: "circle", bg: "#ffffff", fg: "#bc002d" },
  FR: { name: "France",      type: "vert",   colors: ["#0055A4", "#ffffff", "#EF4135"] },
  DE: { name: "Germany",     type: "horiz",  colors: ["#000000", "#DD0000", "#FFCE00"] },
  IT: { name: "Italy",       type: "vert",   colors: ["#009246", "#ffffff", "#CE2B37"] },
  NL: { name: "Netherlands", type: "horiz",  colors: ["#AE1C28", "#ffffff", "#21468B"] },
  SE: { name: "Sweden",      type: "cross",  bg: "#006AA7", fg: "#FECC00" },
  BE: { name: "Belgium",     type: "vert",   colors: ["#111111", "#FDDA24", "#EF3340"] },
  IE: { name: "Ireland",     type: "vert",   colors: ["#169B62", "#ffffff", "#FF883E"] },
  AT: { name: "Austria",     type: "horiz",  colors: ["#ED2939", "#ffffff", "#ED2939"] },
  PL: { name: "Poland",      type: "horiz",  colors: ["#ffffff", "#DC143C"] },
  DK: { name: "Denmark",     type: "cross",  bg: "#C60C30", fg: "#ffffff" },
  ES: { name: "Spain",       type: "horiz",  colors: ["#AA151B", "#F1BF00", "#F1BF00", "#AA151B"] },
};
const ALL_CODES = Object.keys(FLAGS);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Draw a flag inside rect (x,y,w,h) with optional rounded corners
function drawFlag(code, x, y, w, h, r = 3) {
  const f = FLAGS[code];
  ctx.save();
  roundRect(x, y, w, h, r);
  ctx.clip();
  if (f.type === "vert") {
    const n = f.colors.length, cw = w / n;
    for (let i = 0; i < n; i++) { ctx.fillStyle = f.colors[i]; ctx.fillRect(x + i * cw, y, cw + 1, h); }
  } else if (f.type === "horiz") {
    const n = f.colors.length, ch = h / n;
    for (let i = 0; i < n; i++) { ctx.fillStyle = f.colors[i]; ctx.fillRect(x, y + i * ch, w, ch + 1); }
  } else if (f.type === "circle") {
    ctx.fillStyle = f.bg; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = f.fg;
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.28, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.type === "cross") {
    ctx.fillStyle = f.bg; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = f.fg;
    const t = Math.max(3, h * 0.18);
    const cx = x + w * 0.38;
    ctx.fillRect(x, y + h / 2 - t / 2, w, t);      // horizontal bar
    ctx.fillRect(cx - t / 2, y, t, h);             // vertical bar (offset)
  }
  ctx.restore();
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(0,0,0,.35)";
  roundRect(x, y, w, h, r);
  ctx.stroke();
}

// ---------------------------------------------------------------------------
// Geometry
// ---------------------------------------------------------------------------
const PLANE   = { x: 240, y: 108 };
const GATE_Y  = 158;
const LOOP    = { cx: 240, cy: 178, rx: 182, ry: 150 };
const LOADING = { x: LOOP.cx, y: LOOP.cy + LOOP.ry }; // 240, 328

const LANE_COUNT = 4;
const LANE_W = W / LANE_COUNT;                 // 120
const LANE_TOP = 392;
const CARD_W = 96, CARD_H = 56, CARD_GAP = 8;
const MAX_LANE = 6;

const BUS_SLOTS = 12;
const SLOT_COLS = 6;

function laneCenterX(i) { return i * LANE_W + LANE_W / 2; }
function laneCardTarget(lane, idx) {
  return { x: laneCenterX(lane), y: LANE_TOP + idx * (CARD_H + CARD_GAP) + CARD_H / 2 };
}
function busSlotPos(center, i) {
  const col = i % SLOT_COLS, row = Math.floor(i / SLOT_COLS);
  return { x: center.x + (col - 2.5) * 24, y: center.y + (row ? 12 : -12) };
}
function loopPos(t) {
  const theta = Math.PI / 2 + t * Math.PI * 2; // start at bottom (loading)
  return { x: LOOP.cx + LOOP.rx * Math.cos(theta), y: LOOP.cy + LOOP.ry * Math.sin(theta) };
}

// ---------------------------------------------------------------------------
// Audio (tiny WebAudio blips)
// ---------------------------------------------------------------------------
let actx = null;
function beep(freq, dur, type = "sine", vol = 0.15) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    const now = actx.currentTime;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur);
  } catch (e) {}
}
const sndBoard   = () => beep(520, 0.08, "square", 0.10);
const sndDepart  = () => beep(180, 0.18, "sawtooth", 0.08);
const sndSeat    = () => { beep(660, 0.10, "sine", 0.14); setTimeout(() => beep(880, 0.12, "sine", 0.14), 70); };
const sndWin     = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.16), i * 120)); };
const sndOver    = () => { [330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.25, "sawtooth", 0.14), i * 160)); };

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const WAIT_MS = 900;      // base bus wait window after last tap
const LOOP_DUR = 2200;    // ms for one full circle
const WALK_DUR = 320;     // ms for a traveler to walk to the bus

let state = "title";      // title | playing | win | over
let level = 1;
let score = 0;
let lanes = [[], [], [], []];
let gates = [];
let bus = null;
let walkers = [];         // travelers walking lane -> bus
let flyers = [];          // travelers flying bus -> plane gate
let popups = [];          // floating "+N" text
let spawnTimer = 0;
let cfg = null;
let shake = 0;

function levelConfig(n) {
  const gateFlagPool = ALL_CODES.slice();
  // shuffle
  for (let i = gateFlagPool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [gateFlagPool[i], gateFlagPool[j]] = [gateFlagPool[j], gateFlagPool[i]];
  }
  const gateCount = Math.min(2 + Math.floor((n - 1) / 1), 4); // 2,3,4,4...
  const gateCodes = gateFlagPool.slice(0, gateCount);
  const decoyCount = Math.min(1 + Math.floor((n - 1) / 2), 4);
  const decoyCodes = gateFlagPool.slice(gateCount, gateCount + decoyCount);
  const need = 4 + Math.floor((n - 1) * 1.2);
  return {
    gates: gateCodes.map(c => ({ flag: c, need, have: 0 })),
    decoys: decoyCodes,
    wait: Math.max(650, WAIT_MS - (n - 1) * 40),
    spawnMs: Math.max(520, 950 - (n - 1) * 55),
    decoyChance: Math.min(0.45, 0.22 + (n - 1) * 0.03),
  };
}

function startLevel(n) {
  level = n;
  cfg = levelConfig(n);
  gates = cfg.gates;
  lanes = [[], [], [], []];
  walkers = [];
  flyers = [];
  popups = [];
  spawnTimer = 0;
  bus = { state: "idle", pos: { x: LOADING.x, y: LOADING.y }, passengers: [], t: 0, resolved: false, armed: false, departTimer: 0 };
  // Pre-fill lanes
  for (let i = 0; i < LANE_COUNT; i++) {
    for (let k = 0; k < 4; k++) spawnInto(i);
  }
  state = "playing";
}

function pickFlag() {
  if (Math.random() < cfg.decoyChance && cfg.decoys.length) {
    return cfg.decoys[Math.floor(Math.random() * cfg.decoys.length)];
  }
  return gates[Math.floor(Math.random() * gates.length)].flag;
}

function spawnInto(lane) {
  if (lanes[lane].length >= MAX_LANE) return false;
  const t = laneCardTarget(lane, lanes[lane].length);
  lanes[lane].push({ flag: pickFlag(), x: t.x, y: t.y + 40, init: false });
  return true;
}

// ---------------------------------------------------------------------------
// Interaction
// ---------------------------------------------------------------------------
function board(lane) {
  if (bus.state !== "idle") return;
  if (bus.passengers.length + walkers.length >= BUS_SLOTS) { shake = 8; beep(140, 0.12, "square", 0.12); return; }
  const q = lanes[lane];
  if (q.length === 0) return;
  const p = q.shift();
  const slot = bus.passengers.length + walkers.length;
  walkers.push({ flag: p.flag, x: p.x, y: p.y, sx: p.x, sy: p.y, t: 0, slot });
  bus.armed = true;
  bus.departTimer = cfg.wait;
  sndBoard();
}

function depart() {
  if (bus.passengers.length === 0) return;
  bus.state = "loop";
  bus.t = 0;
  bus.resolved = false;
  bus.armed = false;
  sndDepart();
}

function resolveMatches() {
  const remaining = [];
  for (const p of bus.passengers) {
    const g = gates.find(g => g.flag === p.flag && g.have < g.need);
    if (g) {
      g.have++;
      score += 10 * level;
      const gp = gatePos(gates.indexOf(g));
      flyers.push({ flag: p.flag, x: bus.pos.x, y: bus.pos.y, sx: bus.pos.x, sy: bus.pos.y, tx: gp.x, ty: gp.y, t: 0 });
      popups.push({ x: gp.x, y: gp.y - 22, text: "+" + (10 * level), t: 0 });
    } else {
      remaining.push(p);
    }
  }
  bus.passengers = remaining;
  sndSeat();
}

function gatePos(i) {
  const n = gates.length;
  const spread = 150;
  const x = PLANE.x + (n === 1 ? 0 : (i / (n - 1) - 0.5) * spread);
  return { x, y: GATE_Y };
}

function allGatesFull() { return gates.every(g => g.have >= g.need); }

function tap(px, py) {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (state === "title") { startLevel(1); return; }
  if (state === "win")  { score += 0; startLevel(level + 1); return; }
  if (state === "over") { score = 0; startLevel(1); return; }
  if (state === "playing" && py >= LANE_TOP - 20) {
    const lane = Math.max(0, Math.min(LANE_COUNT - 1, Math.floor(px / LANE_W)));
    board(lane);
  }
}

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx * (W / r.width), y: cy * (H / r.height) };
}
canvas.addEventListener("mousedown", e => { const p = pointerPos(e); tap(p.x, p.y); });
canvas.addEventListener("touchstart", e => { e.preventDefault(); const p = pointerPos(e); tap(p.x, p.y); }, { passive: false });

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 0.04);

  if (state !== "playing") return;

  // Spawn travelers to keep lanes populated
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = cfg.spawnMs;
    const candidates = [];
    for (let i = 0; i < LANE_COUNT; i++) if (lanes[i].length < MAX_LANE) candidates.push(i);
    if (candidates.length) spawnInto(candidates[Math.floor(Math.random() * candidates.length)]);
  }

  // Lane cards ease toward their slot targets
  for (let i = 0; i < LANE_COUNT; i++) {
    for (let k = 0; k < lanes[i].length; k++) {
      const p = lanes[i][k], t = laneCardTarget(i, k);
      if (!p.init) { p.x = t.x; p.y = t.y + 30; p.init = true; }
      p.x += (t.x - p.x) * Math.min(1, dt * 0.012);
      p.y += (t.y - p.y) * Math.min(1, dt * 0.012);
    }
  }

  // Walkers -> bus (only meaningful while bus idle at loading)
  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i];
    w.t += dt;
    const k = Math.min(1, w.t / WALK_DUR);
    const target = busSlotPos(bus.pos, w.slot);
    w.x = w.sx + (target.x - w.sx) * easeOut(k);
    w.y = w.sy + (target.y - w.sy) * easeOut(k);
    if (k >= 1) { bus.passengers.push({ flag: w.flag }); walkers.splice(i, 1); }
  }

  // Bus logic
  if (bus.state === "idle") {
    bus.pos.x = LOADING.x; bus.pos.y = LOADING.y;
    if (bus.armed && walkers.length === 0 && bus.passengers.length > 0) {
      if (bus.passengers.length >= BUS_SLOTS) bus.departTimer = 0;
      bus.departTimer -= dt;
      if (bus.departTimer <= 0) depart();
    }
  } else if (bus.state === "loop") {
    bus.t += dt / LOOP_DUR;
    const p = loopPos(bus.t);
    bus.pos.x = p.x; bus.pos.y = p.y;
    if (!bus.resolved && bus.t >= 0.5) { resolveMatches(); bus.resolved = true; }
    if (bus.t >= 1) {
      bus.state = "idle";
      bus.pos.x = LOADING.x; bus.pos.y = LOADING.y;
      bus.armed = false;
      if (allGatesFull()) { state = "win"; sndWin(); }
      else if (bus.passengers.length >= BUS_SLOTS) { state = "over"; shake = 14; sndOver(); }
    }
  }

  // Flyers -> gate
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt;
    const k = Math.min(1, f.t / 500);
    f.x = f.sx + (f.tx - f.sx) * easeOut(k);
    f.y = f.sy + (f.ty - f.sy) * easeOut(k) - Math.sin(k * Math.PI) * 30;
    if (k >= 1) flyers.splice(i, 1);
  }

  // Popups
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    popups[i].y -= dt * 0.03;
    if (popups[i].t > 900) popups.splice(i, 1);
  }
}
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1b2a4a");
  g.addColorStop(0.45, "#24406e");
  g.addColorStop(0.46, "#3a3f46");
  g.addColorStop(1, "#2a2e35");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Apron / tarmac ring under the plane
  ctx.save();
  ctx.translate(LOOP.cx, LOOP.cy);
  ctx.fillStyle = "#33373f";
  ctx.beginPath();
  ctx.ellipse(0, 0, LOOP.rx + 34, LOOP.ry + 30, 0, 0, Math.PI * 2);
  ctx.fill();
  // dashed taxi loop
  ctx.strokeStyle = "rgba(255,220,120,.55)";
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 12]);
  ctx.beginPath();
  ctx.ellipse(0, 0, LOOP.rx, LOOP.ry, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Lane strip background
  ctx.fillStyle = "#20242b";
  ctx.fillRect(0, LANE_TOP - 26, W, H - (LANE_TOP - 26));
  for (let i = 1; i < LANE_COUNT; i++) {
    ctx.strokeStyle = "rgba(255,255,255,.08)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(i * LANE_W, LANE_TOP - 26); ctx.lineTo(i * LANE_W, H); ctx.stroke();
  }
  // Lane labels
  ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.font = "600 13px sans-serif";
  ctx.textAlign = "center";
  for (let i = 0; i < LANE_COUNT; i++) ctx.fillText("GATE " + (i + 1), laneCenterX(i), LANE_TOP - 34);
}

function drawPlane() {
  const cx = PLANE.x, cy = PLANE.y;
  ctx.save();
  // shadow
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(cx, cy + 62, 150, 22, 0, 0, Math.PI * 2); ctx.fill();

  // wings
  ctx.fillStyle = "#c9d3e0";
  ctx.beginPath();
  ctx.moveTo(cx - 40, cy + 6); ctx.lineTo(cx - 175, cy + 40); ctx.lineTo(cx - 175, cy + 54); ctx.lineTo(cx - 30, cy + 24);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 40, cy + 6); ctx.lineTo(cx + 175, cy + 40); ctx.lineTo(cx + 175, cy + 54); ctx.lineTo(cx + 30, cy + 24);
  ctx.closePath(); ctx.fill();

  // fuselage
  const bodyW = 150, bodyH = 74;
  const grad = ctx.createLinearGradient(0, cy - bodyH / 2, 0, cy + bodyH / 2);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(1, "#d3dae4");
  ctx.fillStyle = grad;
  roundRect(cx - bodyW / 2, cy - bodyH / 2, bodyW, bodyH, 34);
  ctx.fill();
  ctx.strokeStyle = "#9aa6b6"; ctx.lineWidth = 2; ctx.stroke();

  // nose cone
  ctx.fillStyle = "#3a4657";
  ctx.beginPath(); ctx.ellipse(cx - bodyW / 2 + 8, cy, 16, 26, 0, 0, Math.PI * 2); ctx.fill();
  // tail fin
  ctx.fillStyle = "#5b6b82";
  ctx.beginPath();
  ctx.moveTo(cx + bodyW / 2 - 10, cy - bodyH / 2);
  ctx.lineTo(cx + bodyW / 2 + 20, cy - bodyH / 2 - 26);
  ctx.lineTo(cx + bodyW / 2 + 20, cy - bodyH / 2 + 4);
  ctx.closePath(); ctx.fill();

  // cockpit windows
  ctx.fillStyle = "#2b3446";
  ctx.beginPath(); ctx.ellipse(cx - bodyW / 2 + 26, cy - 8, 8, 6, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // Gates (doors) with flags + progress
  for (let i = 0; i < gates.length; i++) {
    const g = gates[i], p = gatePos(i);
    const done = g.have >= g.need;
    // door
    ctx.fillStyle = done ? "#1f7a3d" : "#2b3446";
    roundRect(p.x - 24, p.y - 20, 48, 40, 8); ctx.fill();
    ctx.strokeStyle = done ? "#54d98c" : "#4a5568"; ctx.lineWidth = 2;
    roundRect(p.x - 24, p.y - 20, 48, 40, 8); ctx.stroke();
    // flag
    drawFlag(g.flag, p.x - 20, p.y - 15, 40, 26, 3);
    // progress text
    ctx.fillStyle = done ? "#7dffb0" : "#ffffff";
    ctx.font = "700 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(g.have + "/" + g.need, p.x, p.y + 32);
  }
}

function drawPersonMini(x, y, code) {
  // small head + flag chip
  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath(); ctx.arc(x, y - 7, 4, 0, Math.PI * 2); ctx.fill();
  drawFlag(code, x - 9, y - 2, 18, 12, 2);
}

function drawBus() {
  const c = bus.pos;
  ctx.save();
  // shadow
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(c.x, c.y + 24, 82, 12, 0, 0, Math.PI * 2); ctx.fill();
  // body
  const bw = 162, bh = 50;
  const grad = ctx.createLinearGradient(0, c.y - bh / 2, 0, c.y + bh / 2);
  grad.addColorStop(0, "#ffd34d");
  grad.addColorStop(1, "#f0a500");
  ctx.fillStyle = grad;
  roundRect(c.x - bw / 2, c.y - bh / 2, bw, bh, 10); ctx.fill();
  ctx.strokeStyle = "#b97e00"; ctx.lineWidth = 2; ctx.stroke();
  // wheels
  ctx.fillStyle = "#1b1b1b";
  ctx.beginPath(); ctx.arc(c.x - bw / 2 + 26, c.y + bh / 2, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(c.x + bw / 2 - 26, c.y + bh / 2, 8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // passenger slots
  for (let i = 0; i < BUS_SLOTS; i++) {
    const s = busSlotPos(c, i);
    if (i < bus.passengers.length) {
      drawFlag(bus.passengers[i].flag, s.x - 9, s.y - 6, 18, 12, 2);
    } else {
      ctx.fillStyle = "rgba(0,0,0,.14)";
      roundRect(s.x - 9, s.y - 6, 18, 12, 3); ctx.fill();
    }
  }
  // occupancy badge
  ctx.fillStyle = bus.passengers.length + walkers.length >= BUS_SLOTS ? "#ff5a5a" : "rgba(0,0,0,.55)";
  roundRect(c.x + 60, c.y - 40, 40, 20, 6); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "700 12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText((bus.passengers.length + walkers.length) + "/12", c.x + 80, c.y - 26);
}

function drawTraveler(x, y, code, big) {
  const w = big ? CARD_W : 40, h = big ? CARD_H : 26;
  // card
  ctx.fillStyle = "#eef2f7";
  roundRect(x - w / 2, y - h / 2, w, h, 8); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.2)"; ctx.lineWidth = 1;
  roundRect(x - w / 2, y - h / 2, w, h, 8); ctx.stroke();
  // person head
  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath(); ctx.arc(x - w / 2 + 15, y, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a4657";
  roundRect(x - w / 2 + 8, y + 6, 14, 10, 3); ctx.fill();
  // flag
  drawFlag(code, x - w / 2 + 30, y - 14, big ? 52 : 34, big ? 28 : 20, 3);
}

function drawLanes() {
  for (let i = 0; i < LANE_COUNT; i++) {
    for (let k = lanes[i].length - 1; k >= 0; k--) {
      const p = lanes[i][k];
      // front (k=0) highlight
      if (k === 0) {
        ctx.save();
        ctx.shadowColor = "rgba(120,200,255,.8)";
        ctx.shadowBlur = 14;
        drawTraveler(p.x, p.y, p.flag, true);
        ctx.restore();
      } else {
        ctx.globalAlpha = 0.9;
        drawTraveler(p.x, p.y, p.flag, true);
        ctx.globalAlpha = 1;
      }
    }
  }
}

function drawWalkers() {
  for (const w of walkers) drawTraveler(w.x, w.y, w.flag, false);
}
function drawFlyers() {
  for (const f of flyers) {
    ctx.save();
    ctx.shadowColor = "rgba(255,255,255,.9)"; ctx.shadowBlur = 10;
    drawPersonMini(f.x, f.y, f.flag);
    ctx.restore();
  }
}
function drawPopups() {
  for (const p of popups) {
    ctx.fillStyle = `rgba(125,255,176,${Math.max(0, 1 - p.t / 900)})`;
    ctx.font = "800 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y);
  }
}

function drawHUD() {
  ctx.fillStyle = "#fff";
  ctx.font = "800 16px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("LEVEL " + level, 12, 24);
  ctx.textAlign = "right";
  ctx.fillText("SCORE " + score, W - 12, 24);
}

function drawOverlay() {
  ctx.fillStyle = "rgba(6,10,22,.82)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  if (state === "title") {
    ctx.fillStyle = "#ffd34d"; ctx.font = "800 44px sans-serif";
    ctx.fillText("SKY SORT", W / 2, 220);
    ctx.fillStyle = "#cdd6e5"; ctx.font = "600 18px sans-serif";
    ctx.fillText("Board every traveler onto the plane", W / 2, 268);
    ctx.font = "400 15px sans-serif"; ctx.fillStyle = "#9fb0c8";
    const lines = [
      "• Tap a gate lane to send its front traveler",
      "  onto the shuttle bus.",
      "• Keep tapping to load more before the bus",
      "  circles the plane (it waits a moment).",
      "• A traveler boards the plane only if their",
      "  flag matches a gate that still has room.",
      "• Mismatched travelers ride back and eat one",
      "  of the bus's 12 seats — don't get blocked!",
    ];
    lines.forEach((l, i) => ctx.fillText(l, W / 2, 320 + i * 26));
    pulseButton("TAP TO PLAY", 600);
  } else if (state === "win") {
    ctx.fillStyle = "#7dffb0"; ctx.font = "800 40px sans-serif";
    ctx.fillText("PLANE FULL!", W / 2, 300);
    ctx.fillStyle = "#cdd6e5"; ctx.font = "600 20px sans-serif";
    ctx.fillText("Level " + level + " cleared", W / 2, 344);
    ctx.fillText("Score: " + score, W / 2, 376);
    pulseButton("TAP FOR LEVEL " + (level + 1), 460);
  } else if (state === "over") {
    ctx.fillStyle = "#ff6b6b"; ctx.font = "800 40px sans-serif";
    ctx.fillText("BUS BLOCKED", W / 2, 300);
    ctx.fillStyle = "#cdd6e5"; ctx.font = "600 18px sans-serif";
    ctx.fillText("The shuttle jammed with mismatched flags.", W / 2, 342);
    ctx.fillText("Final score: " + score, W / 2, 374);
    pulseButton("TAP TO RESTART", 460);
  }
}
function pulseButton(text, y) {
  const s = 1 + Math.sin(performance.now() / 300) * 0.04;
  ctx.save();
  ctx.translate(W / 2, y);
  ctx.scale(s, s);
  ctx.fillStyle = "#ffd34d";
  roundRect(-130, -26, 260, 52, 26); ctx.fill();
  ctx.fillStyle = "#1b1b1b"; ctx.font = "800 20px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(text, 0, 7);
  ctx.restore();
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  if (bus) {
    drawPlane();
    drawFlyers();
    drawBus();
    drawWalkers();
    drawLanes();
    drawPopups();
    drawHUD();
  }
  ctx.restore();
  if (state !== "playing") drawOverlay();
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
